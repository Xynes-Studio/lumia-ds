name: Visual Regression Testing

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [ main, master, develop, 'develop-*', 'release/*' ]

permissions:
  contents: read

jobs:
  visual-test:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # verified upstream actions/checkout
        with:
          persist-credentials: false
      
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # verified upstream pnpm/action-setup
        with:
          version: 10.23.0
          
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified upstream actions/setup-node
        with:
          node-version: 22.22.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook prerequisites (tokens + theme)
        # Storybook resolves @lumia-ui/theme/dist/tailwind/tailwind.js via
        # PostCSS, and aliases @lumia-ui/tokens/dist via Vite, so both packages
        # need a built dist/ before storybook:build runs. The repo already
        # exposes pnpm storybook:reset for this purpose; CI just needs to call
        # it. Without this step, Build Storybook fails with:
        #   [vite:css] [postcss] Cannot find module
        #     './node_modules/@lumia-ui/theme/dist/tailwind/tailwind.js'
        run: pnpm storybook:reset

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Run Visual Tests
        run: pnpm test:visual
        env:
          CI: true

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified upstream actions/upload-artifact
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
