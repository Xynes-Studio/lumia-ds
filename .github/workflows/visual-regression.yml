name: Visual Regression Testing

on:
  pull_request:
    branches: [ main, master, develop, 'develop-*' ]

jobs:
  visual-test:
    name: Visual Regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.50.1-noble
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Build Storybook prerequisites (tokens + theme)
        # Storybook resolves @lumia-ui/theme/dist/tailwind/tailwind.js via
        # PostCSS, and aliases @lumia-ui/tokens/dist via Vite, so both packages
        # need a built dist/ before storybook:build runs. The repo already
        # exposes pnpm storybook:reset for this purpose; CI just needs to call
        # it. Without this step, Build Storybook fails with:
        #   [vite:css] [postcss] Cannot find module
        #     './node_modules/@lumia-ui/theme/dist/tailwind/tailwind.js'
        run: pnpm storybook:reset

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Run Visual Tests
        run: pnpm test:visual
        env:
          CI: true

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
